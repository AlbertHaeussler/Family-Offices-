<style>
  :root{
    --navy:#0A1F44; --navy2:#13294B; --gold:#FFC72C; --red:#E4002B;
    --bg:#eef1f5; --panel:rgba(255,255,255,.82); --stroke:#dfe3ea; --txt:#0A1F44; --muted:#5b6577; --accent:#0A1F44;
  }
  *{box-sizing:border-box}
  html,body,#root{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:var(--bg)}
  #map{position:absolute;inset:0;z-index:0}
  /* liquid glass: frosted translucency, glossy top rim, layered depth */
  .glass{background:linear-gradient(140deg, rgba(255,255,255,.78), rgba(255,255,255,.60));
    backdrop-filter:saturate(190%) blur(26px);-webkit-backdrop-filter:saturate(190%) blur(26px);
    border:1px solid rgba(255,255,255,.55);border-radius:18px;
    box-shadow:0 14px 40px rgba(10,31,68,.22),0 3px 10px rgba(10,31,68,.12),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 2px rgba(10,31,68,.05),inset 0 0 0 1px rgba(255,255,255,.10)}
  .lights{display:flex;gap:8px;align-items:center}
  .light{width:13px;height:13px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
  .l-red{background:#ff5f57}.l-yellow{background:#febc2e}.l-green{background:#28c840}
  .light.dis{cursor:default;opacity:.5}
  .topbar{position:absolute;top:14px;left:14px;z-index:500;padding:10px 16px;display:flex;align-items:center;gap:12px}
  .topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.2px;color:var(--navy)}
  .topbar .sub{font-size:11px;color:var(--muted)}
  .iBtn{width:22px;height:22px;border-radius:50%;border:1px solid var(--stroke);background:#fff;color:var(--navy);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  h2.hd{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px}
  .panel{padding:14px}
  /* right stacked column – no overlaps */
  .rightcol{position:absolute;top:14px;right:14px;width:266px;max-height:calc(100vh - 28px);overflow-y:auto;z-index:500;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
  .dotrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer;transition:background .15s;user-select:none}
  .dotrow:hover{background:rgba(10,31,68,.05)}
  .dot{width:15px;height:15px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .dotrow.off{opacity:.42}.dotrow.off .dot{background:#c7c7cc!important}
  .dotlabel{font-size:12.5px;line-height:1.25}
  .stat{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
  .stat b{font-variant-numeric:tabular-nums;color:var(--navy)}
  .pie-wrap{display:flex;flex-direction:column;align-items:center;margin-top:6px}
  .pielegend{width:100%;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
  .pchip{display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;padding:2px 3px;border-radius:7px;user-select:none}
  .pchip:hover{background:rgba(10,31,68,.06)}.pchip.off{opacity:.36;text-decoration:line-through}
  .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
  .adv{position:absolute;top:92px;left:14px;width:300px;max-height:calc(100vh - 106px);overflow:auto;z-index:500;padding:14px;resize:both;min-width:250px;min-height:150px;max-width:min(560px,60vw)}
  /* Mac-style drag-to-resize: grip in the bottom-right corner */
  .rightcol .panel{resize:vertical;overflow:auto;min-height:70px}
  .adv::-webkit-resizer,.rightcol .panel::-webkit-resizer,.win::-webkit-resizer{background:linear-gradient(135deg,transparent 0 46%,rgba(10,31,68,.4) 46% 54%,transparent 54% 70%,rgba(10,31,68,.4) 70% 78%,transparent 78%)}
  .fld{margin:9px 0}.fld label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
  select,input[type=number],input[type=text]{width:100%;padding:7px 9px;border:1px solid rgba(255,255,255,.6);border-radius:10px;font-size:13px;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 2px rgba(10,31,68,.06)}
  .row2{display:flex;gap:8px}
  .chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
  .chk{display:flex;align-items:center;gap:6px;font-size:11.5px;cursor:pointer;user-select:none;padding:2px}
  .chk .sw{width:9px;height:9px}
  .togg{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;user-select:none;padding:3px 0}
  .switch{width:34px;height:20px;border-radius:20px;background:#c9ced8;position:relative;transition:background .15s;flex:0 0 auto}
  .switch.on{background:var(--navy)}
  .switch i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch.on i{left:16px}
  .btn{appearance:none;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff;transition:filter .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 6px rgba(10,31,68,.25)}
  .btn:hover{filter:brightness(1.15)}
  .btn.sec{background:rgba(255,255,255,.55);color:var(--navy);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 1px 3px rgba(10,31,68,.1)}
  .btn.ghost{background:rgba(255,255,255,.3);color:var(--navy);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .btn.wide{width:100%}.btnrow{display:flex;gap:8px;margin-top:8px}
  .pininfo{font-size:11px;color:var(--muted);margin-top:4px}
  .layerToggle{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:500;display:flex;gap:2px;padding:4px;border-radius:12px}
  .layerToggle button{border:none;background:transparent;padding:6px 14px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--navy)}
  .layerToggle button.on{background:var(--navy);color:#fff}
  .detail h3{margin:0 0 2px;font-size:16px;color:var(--navy)}
  .detail .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-top:1px solid var(--stroke)}
  .kv span:first-child{color:var(--muted)}
  a.lnk,.src a{color:#1c58c9;text-decoration:none;word-break:break-word}
  a.lnk:hover,.src a:hover{text-decoration:underline}
  .est-badge{display:inline-block;font-size:10px;font-weight:700;color:#7a5200;background:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px}
  .sold-badge{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--red);border-radius:6px;padding:1px 6px;margin-left:6px}
  .src{margin-top:3px;font-size:11px;color:var(--muted);line-height:1.5}
  .src .lab{font-weight:700;color:#3b4658}
  .srcbox{background:rgba(10,31,68,.04);border-radius:10px;padding:8px 10px;margin:6px 0}
  .brandhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .brandhead img{width:30px;height:30px;border-radius:7px;object-fit:contain;background:#fff;border:1px solid var(--stroke)}
  .objlist{margin-top:10px}
  .obj{font-size:12px;padding:7px 0;border-top:1px solid var(--stroke);cursor:pointer}
  .obj:hover{color:var(--navy)}.obj b{font-weight:700}.obj .a{color:var(--muted)}
  .winwrap{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(10,31,68,.3)}
  .win{width:min(1180px,95vw);height:min(78vh,760px);display:flex;flex-direction:column;overflow:hidden;resize:both;min-width:420px;min-height:220px;max-width:98vw;max-height:96vh}
  .win.max{resize:none}
  .win.min{height:46px}.win.max{width:100vw;height:100vh;border-radius:0}
  .titlebar{height:46px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--stroke);background:rgba(255,255,255,.7)}
  .titlebar .t{font-size:13px;font-weight:700;color:var(--navy)}.titlebar .sp{flex:1}
  .tabs{display:flex;gap:4px;background:rgba(10,31,68,.06);border-radius:10px;padding:3px;margin-right:8px}
  .tabbtn{appearance:none;border:none;background:transparent;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:all .15s}
  .tabbtn:hover{background:rgba(255,255,255,.5)}
  .tabbtn.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(10,31,68,.18)}
  .objrow{cursor:pointer}
  .tblscroll{flex:1;overflow:auto}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--stroke);white-space:nowrap}
  th{position:sticky;top:0;background:#f3f5f9;cursor:pointer;user-select:none;font-weight:700;color:var(--navy)}
  th:hover{color:var(--red)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.warum{white-space:normal;min-width:220px;max-width:300px;font-size:11.5px;color:#3b4658;line-height:1.35}
  tr:hover td{background:rgba(10,31,68,.05)}
  /* AI-description blocks in the detail panels */
  .aibox{background:rgba(10,31,68,.045);border:1px solid var(--stroke);border-radius:11px;padding:9px 11px;margin:8px 0}
  .aibox .ai-h{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px}
  .ai-tag{font-size:9px;font-weight:700;color:#5b4b00;background:var(--gold);border-radius:5px;padding:1px 5px;letter-spacing:0}
  .aibox ul{margin:2px 0 0;padding-left:16px}.aibox li{font-size:12px;line-height:1.5;margin:2px 0}
  .aibox .row{font-size:12px;line-height:1.45;margin:3px 0}.aibox .row b{color:var(--navy)}
  .why{background:linear-gradient(140deg,rgba(255,199,44,.16),rgba(255,199,44,.06));border:1px solid rgba(255,199,44,.5);border-radius:11px;padding:9px 11px;margin:8px 0;font-size:12.5px;line-height:1.45;color:#5a4200}
  .why b{color:#0A1F44}
  /* Ankaufsprofil – eigener, klar hervorgehobener Block (liquid glass, Savills-Navy) */
  .ankbox{background:linear-gradient(140deg,rgba(10,31,68,.10),rgba(10,31,68,.03));border:1px solid rgba(10,31,68,.18);border-radius:11px;padding:10px 12px;margin:8px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .ankbox .ai-h{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin-bottom:5px}
  .ankbox .body{font-size:12.5px;line-height:1.5;color:#24314d}
  .ankbox .na{font-style:italic;color:var(--muted)}
  .uidline{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.2px}
  .uidline b{color:var(--navy);font-weight:600}
  .objbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--stroke);font-size:12px;color:var(--muted);background:rgba(255,255,255,.45);flex:0 0 auto}
  .objbar .seg{display:flex;gap:2px;background:rgba(10,31,68,.07);border-radius:9px;padding:3px}
  .objbar .seg button{border:none;background:transparent;padding:5px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;color:var(--navy)}
  .objbar .seg button.on{background:var(--navy);color:#fff;box-shadow:0 1px 3px rgba(10,31,68,.3)}
  .objbar .seg button:disabled{opacity:.4;cursor:not-allowed}
  .s3wrap{position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;background:rgba(10,31,68,.32)}
  .s3{width:min(470px,92vw);max-height:86vh;overflow:auto;padding:0}
  .s3 .hd{padding:12px 16px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:10px}
  .s3 .bd{padding:14px 16px}.s3 h3{margin:0 0 2px;font-size:16px;color:var(--navy)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;color:#fff}
  .discpop{position:absolute;top:52px;left:14px;z-index:700;width:330px;padding:14px;font-size:12px;line-height:1.5}
  .disc{position:absolute;bottom:58px;right:14px;z-index:450;font-size:10.5px;color:var(--muted);max-width:250px;text-align:right;line-height:1.35;pointer-events:none}
  .leaflet-div-icon{background:transparent;border:none}
  /* HQ nameplate: solid shield behind BOTH logo and full name */
  .hqbox{display:inline-flex;width:max-content;align-items:center;gap:7px;padding:4px 12px 4px 8px;border-radius:13px;
    background:linear-gradient(140deg, rgba(255,255,255,.93), rgba(255,255,255,.82));
    backdrop-filter:saturate(160%) blur(8px);-webkit-backdrop-filter:saturate(160%) blur(8px);
    border:2px solid var(--ring,#ccc);box-shadow:0 3px 10px rgba(10,31,68,.30),inset 0 1px 0 rgba(255,255,255,.9);
    cursor:pointer;transition:transform .12s;white-space:nowrap}
  .hqbox.est{border-style:dashed}
  .hqbox.sel{transform:scale(1.14);box-shadow:0 0 0 3px rgba(10,31,68,.3),0 2px 10px rgba(10,31,68,.35)}
  .hqbox.hl{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,199,44,0),0 2px 8px rgba(10,31,68,.28)}50%{box-shadow:0 0 0 6px rgba(255,199,44,.6),0 2px 8px rgba(10,31,68,.3)}}
  /* logo sits ON the same shield – no separate box of its own */
  .hqico{width:19px;height:19px;border-radius:4px;object-fit:contain;flex:0 0 auto;background:transparent}
  .hqname{font-size:12.5px;font-weight:700;color:var(--navy);line-height:1.05;max-width:190px}
  .heatpoly{filter:blur(3px)}
  /* ---- push-pins: what you see when zoomed out, like pins stuck in a printed map ---- */
  /* a pin = a big round coloured head with a glossy highlight, sitting on a needle whose tip is exactly on the spot */
  .pin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .pin .head{border-radius:50%;border:2px solid #fff;box-sizing:border-box;position:relative;
    box-shadow:0 3px 5px rgba(10,31,68,.55),0 1px 0 rgba(255,255,255,.4)}
  .pin .head::after{content:"";position:absolute;top:16%;left:18%;width:34%;height:34%;border-radius:50%;
    background:radial-gradient(circle at 40% 40%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%)}
  .pin .needle{width:3px;margin-top:-2px;background:linear-gradient(to bottom,#f4f6fa 0%, #c3ccda 55%, rgba(120,132,150,.35) 100%);
    box-shadow:0 2px 3px rgba(10,31,68,.5);border-radius:0 0 2px 2px}
  .pin.sold .head{border-style:dashed}
  .pin.hqpin .head{cursor:pointer}
  /* object markers when zoomed in: colour-coded badge with a type icon */
  .objbadge{border-radius:50%;box-shadow:0 1px 5px rgba(10,31,68,.45);display:flex;align-items:center;justify-content:center;line-height:1;box-sizing:border-box;cursor:pointer}
  .objbadge.sold{border-style:dashed!important;opacity:.8}
  .objico{line-height:1;filter:drop-shadow(0 0 1px rgba(255,255,255,.9))}
  /* bottom-left selection dock */
  .seldock{position:absolute;left:14px;bottom:14px;z-index:600;width:244px;padding:12px 13px;max-height:56vh;display:flex;flex-direction:column}
  .seldock-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .seldock-h b{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .seldock .mini{border:none;background:rgba(228,0,43,.1);color:var(--red);font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;cursor:pointer}
  .selchips{display:flex;flex-direction:column;gap:5px;overflow-y:auto}
  .selchip{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--navy);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.55);border-left:3px solid var(--ring,#ccc);border-radius:9px;padding:5px 7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
  .selchip .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .selchip .x{cursor:pointer;color:var(--muted);font-weight:700;padding:0 3px;border-radius:5px}
  .selchip .x:hover{background:rgba(228,0,43,.12);color:var(--red)}
  .selempty{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:8px}
  .selexp{margin-top:9px;border-top:1px solid var(--stroke);padding-top:9px}
  .selexp-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--navy);cursor:pointer;user-select:none}
  .selexp-list{margin-top:7px;max-height:32vh;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
  .selrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 6px;border-radius:7px;cursor:pointer}
  .selrow:hover{background:rgba(10,31,68,.06)}
  .sc-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
  .sr-nm{flex:0 0 auto}
  .sr-sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:2px}
  .selsearch{position:relative;margin-top:7px;display:flex;align-items:center}
  .selsearch .ss-ico{position:absolute;left:8px;font-size:12px;opacity:.65;pointer-events:none}
  .ss-in{width:100%;box-sizing:border-box;padding:7px 26px 7px 27px;border:1px solid var(--stroke);border-radius:8px;
    font-size:12.5px;color:var(--navy);background:rgba(255,255,255,.9);outline:none}
  .ss-in:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(10,31,68,.12)}
  .ss-x{position:absolute;right:7px;font-size:11px;color:var(--muted);cursor:pointer;padding:2px}
  .ss-x:hover{color:var(--navy)}
  @media (max-width:900px){ .rightcol{width:220px} .adv{width:230px} .seldock{width:210px} }
  /* ---- Markt-Radar (News) ---- */
  .radarBtn{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:500;display:flex;align-items:center;gap:8px;padding:9px 16px;border:none;border-radius:14px;cursor:pointer;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(140deg,var(--navy),var(--navy2));box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px rgba(10,31,68,.3)}
  .radarBtn:hover{filter:brightness(1.15)}
  .radarBtn .pdot{display:flex;gap:3px}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const DATA=window.FO_DATA, UL=window.USAGE_LABELS, UC=window.USAGE_COLORS, CM=window.CATEGORY_META, INT=window.INTENSITY;
const USAGE_KEYS=Object.keys(UL), CATS=["gruen","gelb","rot"];
// small type "logo" per usage: office=skyscraper, living=house, logistics=truck, …
const USAGE_EMOJI={ Buero:"🏢", Wohnen:"🏠", Retail:"🏬", Logistik:"🚚", Hotel:"🏨", Gastro:"🍽️", Sonstiges:"🏙️" };
// merge curated descriptions (descriptions.js) into the firm objects by id
const DESC=window.FO_DESC||{};
DATA.forEach(o=>{const d=DESC[o.id];if(!d)return;
  if(d.about&&!o.about)o.about=d.about;
  if(d.structure&&!o.structure)o.structure=d.structure;
  if(d.objects)(o.confirmedObjects||[]).forEach(ob=>{if(!ob.connection&&d.objects[ob.name])ob.connection=d.objects[ob.name];});
  if(d.sources)o._srcNotes=d.sources;
});
const fmtB=n=> n>=1? (n>=10?n.toFixed(0):n.toFixed(1))+" Mrd €" : (n*1000).toFixed(0)+" Mio €";
const hv=(a,b,c,d)=>{const R=6371,t=x=>x*Math.PI/180;const p=t(c-a),q=t(d-b);
  const s=Math.sin(p/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(q/2)**2;return 2*R*Math.asin(Math.sqrt(s));};
const isSold=ob=>/verkauf/i.test(ob.status||"");
const ico=d=>`https://icons.duckduckgo.com/ip3/${d}.ico`;
// auto short profile from structured fields (used when no curated `about` exists) – simple language
function autoAbout(o){
  const top=USAGE_KEYS.filter(k=>(o.usage[k]||0)>0).sort((a,b)=>o.usage[b]-o.usage[a]).slice(0,3).map(k=>UL[k]);
  const city=(o.hqAddress||"").split(",").pop().trim().replace(/^\d[\d\s]*/,"");
  const fam=(o.kurz.match(/\(([^)]+)\)/)||[])[1];
  const kind=o.typ==="SFO"?"das private Geld-Team einer einzelnen reichen Familie"
            :o.typ==="MFO"?"ein Geld-Team, das für mehrere reiche Familien arbeitet"
            :"ein Geld-Team, das ein großes Vermögen verwaltet";
  const out=[
    `Das hier ist ${kind}${fam?` – nämlich die Familie ${fam}`:""}${city?`. Das Büro sitzt in ${city}`:""}.`,
    `Ein „Family Office" ist einfach das Team, das sich um das ganze Geld einer Familie kümmert und es anlegt – zum Beispiel in Firmen, Aktien und in Häuser und Grundstücke.`,
    `Insgesamt geht es um rund ${fmtB(o.aum.value)}${o.aum.basis==="extrapolation"?" (geschätzt)":""}. Davon stecken ungefähr ${fmtB(o.reInvestedEUR)} in Immobilien – das sind etwa ${Math.round(o.reQuote.value*100)} von 100 Teilen des Vermögens.`
  ];
  if(top.length)out.push(`Am liebsten kaufen sie diese Art von Immobilien: ${top.join(", ")}.`);
  return out;
}
// structure/contact block: curated if present, else assembled from existing contact fields
function foStructure(o){
  if(o.structure)return {...o.structure,curated:true};
  const managers=(o.contactName||"").split(/·|;|\n/).map(s=>s.trim()).filter(Boolean);
  return {fo:`${o.name} (${o.typ})`, managers, decisions:o.contactRole||"", contact:o.contactChannel||"", curated:false};
}
// deterministic "why does this firm match the current search"
function whyMatch(o,conf,heat,hasPin,activeUsages){
  if(hasPin){const parts=[];
    if(conf&&conf.length){const nm=conf.slice(0,2).map(ob=>`${ob.name} (${UL[ob.usage]||ob.usage})`).join(", ");
      parts.push(`${conf.length} bestätigte(s) Objekt(e) im Umkreis: ${nm}${conf.length>2?` +${conf.length-2}`:""}`);}
    if(heat&&heat.length){const r=heat[0];
      parts.push(`Investitionsregion „${r.name}" (${r.intensity}${r.basis==="extrapolation"?", geschätzt":""}) überschneidet den Radius`);}
    return parts.join(" · ")||"Erfüllt die Filterkriterien im Radius";}
  const us=USAGE_KEYS.filter(k=>(o.usage[k]||0)>0&&(!activeUsages||activeUsages.has(k))).sort((a,b)=>o.usage[b]-o.usage[a]).map(k=>UL[k]);
  return `Investiert in ${us.slice(0,3).join(", ")||"Immobilien"} · Immobilienquote ${Math.round(o.reQuote.value*100)} %`;
}
// normalize for fuzzy search: lowercase, strip diacritics, expand umlauts, drop noise
const foNorm=s=>(s||"").toLowerCase()
  .replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss")
  .normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim();
// is `q` a (gapped) subsequence of `t`? -> tolerates typos/missing letters
function foSubseq(q,t){let i=0;for(let j=0;j<t.length&&i<q.length;j++)if(t[j]===q[i])i++;return i===q.length;}
// score how well a firm matches query q (higher = better; 0 = no match)
function foScore(o,qRaw){
  const q=foNorm(qRaw); if(!q) return 1;
  const hay=foNorm([o.kurz,o.name,o.land,o.hqAddress].filter(Boolean).join(" "));
  const kurz=foNorm(o.kurz), name=foNorm(o.name), ident=foNorm((o.kurz||"")+" "+(o.name||""));
  if(!hay) return 0;
  const toks=q.split(" ").filter(Boolean);
  let score=0;
  for(const tk of toks){
    let s=0;
    if(kurz===tk||name===tk) s=100;
    else if(kurz.startsWith(tk)) s=80;
    else if(new RegExp("(^| )"+tk).test(hay)) s=60;      // word-boundary match anywhere
    else if(hay.includes(tk)) s=45;                        // substring anywhere
    else if(tk.length>=3&&foSubseq(tk,kurz)) s=30;         // fuzzy vs short name
    else if(tk.length>=4&&foSubseq(tk,ident)) s=18;        // fuzzy vs firm/family name (not address)
    if(s===0) return 0;                                    // every token must match somewhere
    score+=s;
  }
  return score;
}
const HEAT={ niedrig:"#5aa9ff", mittel:"#ffb02e", hoch:"#ff5a5f" };
function seedOf(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%1000;return h/1000*6.28;}
// organic (non-circular) region polygon
function blob(center,radiusKm,seed){
  const lat=center[0],lng=center[1],N=20,pts=[];
  const kLat=1/111, kLng=1/(111*Math.cos(lat*Math.PI/180));
  for(let i=0;i<N;i++){const a=i/N*2*Math.PI;
    const r=radiusKm*(0.80+0.20*Math.sin(a*3+seed)+0.12*Math.sin(a*5+seed*1.7)+0.06*Math.sin(a*2+seed*0.6));
    pts.push([lat+r*kLat*Math.cos(a), lng+r*kLng*Math.sin(a)]);}
  return pts;
}

/* =======================  NEWS / MARKT-RADAR  ======================= */
const NEWS=window.FO_NEWS||[];
const NEWS_STAND=window.FO_NEWS_STAND||"";
// green = owns now, red = owned before
const NEWS_COL={ besitzt:"#34c759", besessen:"#ff3b30" };
const NEWS_STATUS_LABEL={ besitzt:"besitzt", besessen:"besessen" };
// object-type synonyms (human words -> usage keys)
const USAGE_SYNONYMS={
  Buero:["buero","buros","bueros","office","offices","bueroturm","buerohaus","bueropark","bank","banken"],
  Wohnen:["wohn","wohnung","wohnungen","wohnanlage","wohnportfolio","wohnquartier","residential","apartment","mietshaus","zinshaus"],
  Retail:["retail","einzelhandel","laden","geschaeftshaus","fachmarkt","fachmarktzentrum","shopping","handel","highstreet","kaufhaus","supermarkt","nahversorgung"],
  Logistik:["logistik","lager","halle","warehouse","logistikpark","logistikzentrum","distribution","light industrial","gewerbepark"],
  Hotel:["hotel","hotels","beherbergung","hospitality","boardinghouse"],
  Gastro:["gastro","gastronomie","restaurant","gaststaette"],
  Sonstiges:["mixed","gemischt","quartier","sonstiges"]
};
// city -> broad region (for "in der Region"-Text). Built from the data.
const NEWS_CITIES=Array.from(new Set(NEWS.map(n=>n.stadt).filter(Boolean)));
const NEWS_REGIONS=Array.from(new Set(NEWS.map(n=>n.region).filter(Boolean)));
// parse a human question into structured filters
function parseNewsQuery(qRaw){
  const q=foNorm(qRaw);
  const toks=q.split(" ").filter(Boolean);
  const cities=NEWS_CITIES.filter(c=>q.includes(foNorm(c)));
  const regions=NEWS_REGIONS.filter(r=>foNorm(r).length>3 && q.includes(foNorm(r)));
  const usages=USAGE_KEYS.filter(k=>{
    const syns=USAGE_SYNONYMS[k]||[];
    return q.includes(foNorm(UL[k])) || syns.some(s=>toks.some(t=>t.startsWith(s)||s.startsWith(t)&&t.length>=3));
  });
  let rolle=null;
  if(/\b(kauf|kaeuf|erwirbt|erwerb|uebernimmt|uebernahme|invest|sucht)\w*/.test(q)) rolle="Käufer";
  if(/\b(verkauf|veraeuss|trennt|abstoss|verkaeuf)\w*/.test(q)) rolle=rolle?null:"Verkäufer"; // both -> no filter
  // timeframe: "letzten 12 monaten", "letztes jahr", "24 monate"…
  let months=null;
  const mm=q.match(/(\d{1,2})\s*monat/); if(mm) months=+mm[1];
  else if(/letzt\w*\s*jahr|vorigen jahr|12 monat/.test(q)) months=12;
  else if(/2\s*jahr|24 monat/.test(q)) months=24;
  // stopwords we don't want as free-text tokens
  const stop=new Set(["wer","was","wo","welche","welcher","gerade","aktuell","kauft","kaufte","kaufen","gekauft","verkauft","verkaufte","in","im","der","die","das","den","und","oder","ein","eine","zeig","zeige","mir","alle","letzten","letzte","monaten","monate","jahr","jahren","hat","haben","aktiv","aktive","firma","firmen","offices","office","family"]);
  const cityToks=new Set(cities.flatMap(c=>foNorm(c).split(" ")));
  const usageToks=new Set(usages.flatMap(k=>[foNorm(UL[k]),...(USAGE_SYNONYMS[k]||[])].flatMap(s=>s.split(" "))));
  const free=toks.filter(t=>t.length>=3&&!stop.has(t)&&!cityToks.has(t)&&!usageToks.has(t));
  return {cities,regions,usages,rolle,months,free,raw:qRaw};
}
const monthsSince=(iso,ref)=>{const d=new Date(iso+"T00:00:00");return (ref.getFullYear()-d.getFullYear())*12+(ref.getMonth()-d.getMonth());};
// score+filter news for a parsed query. refDate = "today" from data stand.
function filterNews(p,ref){
  return NEWS.map(n=>{
    let s=0;
    if(p.cities.length){ if(p.cities.includes(n.stadt)) s+=40; else if(p.regions.includes(n.region)) s+=15; else return null; }
    else if(p.regions.length){ if(p.regions.includes(n.region)) s+=20; else return null; }
    if(p.usages.length){ if(p.usages.includes(n.objektart)) s+=30; else return null; }
    if(p.rolle){ if(n.rolle===p.rolle) s+=20; else return null; }
    if(p.months!=null){ if(monthsSince(n.datum,ref)<=p.months) s+=10; else return null; }
    if(p.free.length){
      const hay=foNorm([n.firma,n.objekt,n.headline,n.summary,n.stadt,n.region].join(" "));
      const hits=p.free.filter(t=>hay.includes(t)).length;
      if(hits===0 && !p.cities.length && !p.usages.length && !p.rolle) return null;
      s+=hits*8;
    }
    s+=1; // baseline so an empty query returns everything
    return {n,s};
  }).filter(Boolean).sort((a,b)=> b.s-a.s || (b.n.datum>a.n.datum?1:-1)).map(x=>x.n);
}
const fmtMio=v=> v==null?"":(v>=1000?(v/1000).toFixed(1)+" Mrd €":Math.round(v)+" Mio €");
const monthName=iso=>{const M=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sept.","Okt.","Nov.","Dez."];const d=new Date(iso+"T00:00:00");return M[d.getMonth()]+" "+d.getFullYear();};
// natural-language list: "A", "A und B", "A, B und C"
// nicer spoken nouns per usage-key for the answer text
const USAGE_NOUN={ Buero:"Büros", Wohnen:"Wohnungen", Retail:"Einzelhandel", Logistik:"Logistik-Immobilien", Hotel:"Hotels", Gastro:"Gastro-Objekte", Sonstiges:"gemischte Objekte" };
const andList=arr=> arr.length<=1?(arr[0]||""):arr.slice(0,-1).join(", ")+" und "+arr.slice(-1);
const uniqNames=arr=>arr.map(n=>n.firma).filter((v,i,a)=>a.indexOf(v)===i);
// build a short, human answer text from the matched news (deterministic – no LLM needed).
// `matched` is exactly the list the user sees, so answer & list never disagree.
function answerNews(matched,p,ref){
  if(!matched.length){
    return {plain:`Zu dieser Suche gibt es aktuell keine passenden News. Versuch es allgemeiner – z.B. nur die Stadt oder nur die Objektart.`,parts:[],buyers:[],sellers:[]};
  }
  const buyers=matched.filter(n=>n.rolle==="Käufer");
  const sellers=matched.filter(n=>n.rolle==="Verkäufer");
  const where=p.cities.length?p.cities.join(" / "):(p.regions.length?p.regions.join(" / "):"Deutschland");
  const objWord=p.usages.length?p.usages.map(k=>USAGE_NOUN[k]||UL[k]).join(" & "):"Immobilien";
  const period=p.months?`In den letzten ${p.months} Monaten`:`Im erfassten Zeitraum`;
  const deals=x=>`${x} ${x===1?"Deal":"Deals"}`;
  const parts=[];
  if(buyers.length){
    const nm=uniqNames(buyers);
    parts.push(`${period} haben in ${where} ${andList(nm)} ${objWord} gekauft (${deals(buyers.length)}).`);
  }
  if(sellers.length){
    const nm=uniqNames(sellers);
    parts.push(`${buyers.length?"Verkauft haben":`${period} haben in ${where}`} ${andList(nm)}${buyers.length?"":` ${objWord}`} verkauft (${deals(sellers.length)}) – oft ein Zeichen, dass sie wieder zukaufen.`);
  }
  const top=matched.slice().sort((a,b)=>(b.wertMioEUR||0)-(a.wertMioEUR||0))[0];
  if(top&&top.wertMioEUR) parts.push(`Grösster Deal: ${top.firma} – ${top.objekt} (${fmtMio(top.wertMioEUR)}), ${monthName(top.datum)}.`);
  const total=matched.reduce((s,n)=>s+(n.wertMioEUR||0),0);
  if(total) parts.push(`Erfasstes Volumen: ${fmtMio(total)} über ${matched.length} ${matched.length===1?"Meldung":"Meldungen"}.`);
  return {plain:parts.join(" "),parts,buyers:uniqNames(buyers),sellers:uniqNames(sellers)};
}

function Lights({onClose,onMin,onMax}){
  return (<div className="lights">
    <span className="light l-red" title="Schließen" onClick={onClose}/>
    <span className={"light l-yellow"+(onMin?"":" dis")} title={onMin?"Minimieren":""} onClick={onMin||undefined}/>
    <span className={"light l-green"+(onMax?"":" dis")} title={onMax?"Maximieren":""} onClick={onMax||undefined}/>
  </div>);
}

function Sources({field,label,notes}){
  if(!field)return null;
  const ext=field.basis==="extrapolation", noSrc=!field.sources||field.sources.length===0;
  return (<div className="src">
    <span className="lab">{label}:</span>{" "}
    {ext&&noSrc&&<span>Reine Einschätzung (Extrapolation) – keine Einzelquelle.</span>}
    {ext&&!noSrc&&<span>Einschätzung, gestützt auf: </span>}
    {!ext&&<span>Quelle: </span>}
    {!noSrc&&field.sources.map((s,i)=><span key={i}>{i>0?" · ":""}<a href={s.url} target="_blank" rel="noopener">{s.label}</a></span>)}
    {field.note&&<div style={{marginTop:2,fontStyle:"italic"}}>{field.note}</div>}
    {notes&&!noSrc&&field.sources.filter(s=>notes[s.label]).map((s,i)=>(
      <div key={i} style={{marginTop:4,paddingLeft:8,borderLeft:"2px solid var(--stroke)"}}>
        <b style={{color:"#3b4658"}}>{s.label}:</b> {notes[s.label]}</div>))}
  </div>);
}

function Pie({data}){
  const entries=USAGE_KEYS.map(k=>({k,v:data[k]||0})).filter(e=>e.v>0);
  const total=entries.reduce((s,e)=>s+e.v,0)||1;let acc=0;const R=52,C=60;
  const arcs=entries.map(e=>{const a0=acc/total*2*Math.PI,a1=(acc+e.v)/total*2*Math.PI;acc+=e.v;
    const x0=C+R*Math.sin(a0),y0=C-R*Math.cos(a0),x1=C+R*Math.sin(a1),y1=C-R*Math.cos(a1);
    return {...e,d:`M${C},${C} L${x0},${y0} A${R},${R} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1},${y1} Z`,pct:Math.round(e.v/total*100)};});
  if(entries.length===0) return (<div className="pie-wrap"><div style={{fontSize:12,color:"var(--muted)",padding:"10px 0"}}>Keine Immobilien-Nutzung in der Auswahl.</div></div>);
  return (<div className="pie-wrap">
    <svg width="118" height="118" viewBox="0 0 120 120">
      {arcs.map(a=><path key={a.k} d={a.d} fill={UC[a.k]} stroke="#fff" strokeWidth="1.5"/>)}
      <circle cx="60" cy="60" r="26" fill="rgba(255,255,255,.92)"/>
    </svg>
    <div className="pielegend">
      {arcs.map(a=><div key={a.k} className="pchip" style={{cursor:"default"}}><span className="sw" style={{background:UC[a.k]}}/> {UL[a.k]} · {a.pct}%</div>)}
    </div>
  </div>);
}

function App(){
  const mapRef=useRef(null),hqL=useRef(null),objL=useRef(null),heatL=useRef(null),pinL=useRef(null),newsL=useRef(null),tiles=useRef({});

  const allUsages=activeUsages.size===USAGE_KEYS.length;

  const usageOfRegion=r=> allUsages || (Array.isArray(r.usages) && r.usages.some(u=>activeUsages.has(u)));
  const confInRadius=o=> !pin?[]:o.confirmedObjects.filter(ob=>usageOfObj(ob)&&(showSold||!isSold(ob))&&hv(pin.lat,pin.lng,ob.lat,ob.lng)<=pinRadius);
  const heatOverlap=o=> !pin?[]:(o.heatmap||[]).filter(r=>usageOfRegion(r)&&hv(pin.lat,pin.lng,r.center[0],r.center[1])<=pinRadius+r.radiusKm);
  const matchReason=o=> whyMatch(o, pin?confInRadius(o):null, pin?heatOverlap(o):null, !!pin, activeUsages);

  useEffect(()=>{const m=mapRef.current,t=tiles.current;if(!m)return;

      let icon,ttOff;
      if(far){ // a real map pin in the company's status colour

        const html=`<div class="pin hqpin${sel?' sel':''}"><div class="head" style="width:${head}px;height:${head}px;background:${ring}"></div><div class="needle" style="height:${stem}px"></div></div>`;
        icon=L.divIcon({html,className:"",iconSize:[head,head+stem],iconAnchor:[head/2,head+stem]});
        ttOff=-(head+stem);
      } else { // full nameplate – solid white shield behind BOTH logo and the whole name
        const html=`<div class="hqbox ${sel?'sel':''} ${est?'est':''} ${hl?'hl':''}" style="--ring:${ring}">`
          +`${o.domain?`<img class="hqico" src="${ico(o.domain)}" onerror="this.remove()"/>`:''}`
          +`<span class="hqname">${o.kurz}</span></div>`;
        icon=L.divIcon({html,iconSize:[0,0],className:""});

      const m=L.marker([o.hqLat,o.hqLng],{icon,zIndexOffset:(sel||hl)?1000:0}).addTo(lyr);
      m.on("click",()=>toggleSelect(o.id));

    });
  },[visible,selected,highlightId,zoom,soloSel]);

  // heatmap polygons + object pins
  useEffect(()=>{const oly=objL.current,hly=heatL.current;if(!oly)return;oly.clearLayers();hly.clearLayers();
    let objs=[],heats=[];

    rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return typeof x==="number"?(x-y)*sortDir:(""+x).localeCompare(""+y)*sortDir;});return rows;},[visible,sortKey,sortDir]);

         <div className="lights" style={{marginBottom:8}}><span className="light l-red" onClick={()=>setShowDisc(false)}/><span className="light l-yellow dis"/><span className="light l-green dis"/></div>
         <b>Datenqualität &amp; Schätzungen</b><br/>
         Nicht alle Daten sind zu 100 % bestätigt. Geschätzte Werte (AUM, Immobilienquote, Heatmap-Regionen)
         sind mit <span className="est-badge">geschätzt</span> markiert und tragen eigene Quellen — abrufbar direkt am Datenpunkt.<br/><br/>
         <b>Pin</b> mit weißem Kern = bestätigtes Objekt (exakte Adresse). <b>Weiche Fläche</b> = geschätzte Region (Heatmap).<br/>
         <span className="sold-badge">verkauft</span> = Objekt nicht mehr im Bestand (per Toggle ausblendbar).<br/>
         Gestrichelter Logo-Rahmen = im Radius nur über Heatmap getroffen (geschätzt).
       </div>
     )}

     <button className="radarBtn" onClick={()=>{setShowNews(true);setNewsMode("normal");}} title="Markt-Radar: News-Suche nach Käufern/Verkäufern">
       <span className="pdot"><i style={{background:NEWS_COL.besitzt}}/><i style={{background:NEWS_COL.besessen}}/></span>
       Markt-Radar · News-Suche
     </button>

     {/* RIGHT COLUMN (stacked, never overlapping) */}
     <div className="rightcol">
       <div className="panel glass">
         <h2 className="hd">Immobilien-Status</h2>
         {CATS.map(c=><div key={c} className={"dotrow"+(activeCats.has(c)?"":" off")} onClick={()=>toggleCat(c)}>
           <span className="dot" style={{background:CM[c].color}}/><span className="dotlabel">{CM[c].label}</span></div>)}
       </div>
       <div className="panel glass">
         <h2 className="hd">{agg.scoped?`Ausgewählt · ${agg.count} ${agg.count===1?"Office":"Offices"}`:"Auswahl · Kennzahlen"}</h2>
         <div className="stat"><span>Unternehmen</span><b>{agg.count}</b></div>
         <div className="stat"><span>Verwaltetes Vermögen</span><b>{fmtB(agg.aum)}</b></div>
         <div className="stat"><span>davon Immobilien</span><b>{fmtB(agg.re)}</b></div>
         <Pie data={agg.pie}/>
       </div>
       {selOffices.length>0 && (
         <div className="panel glass detail">
           <div className="lights" style={{marginBottom:8}}><span className="light l-red" title="Auswahl schließen" onClick={()=>setSelected(new Set())}/><span className="light l-yellow dis"/><span className="light l-green dis"/></div>
           <h3>{selOffices.length===1?selOffices[0].kurz:selOffices.length+" Offices ausgewählt"}</h3>
           {selOffices.length===1 ? <FirmDetail o={selOffices[0]} reason={matchReason(selOffices[0])} onObj={(o,ob)=>setDetail({kind:"object",office:o,data:ob})} onReg={(o,r)=>setDetail({kind:"region",office:o,data:r})}/> :
             <div className="meta">{selOffices.map(o=>o.kurz).join(" · ")}<br/>Objekte &amp; Heatmaps aller ausgewählten Offices sind eingeblendet.</div>}
         </div>
       )}
     </div>

     {/* ADVANCED SORT (left) */}
     <div className="adv glass">
       <h2 className="hd">Advanced Sort</h2>
       <div className="fld"><label>Land</label>
         <select value={country} onChange={e=>setCountry(e.target.value)}>{countries.map(c=><option key={c} value={c}>{c==="all"?"Alle Länder":c}</option>)}</select></div>
       <div className="fld"><label>Typ</label>
         <select value={typF} onChange={e=>setTypF(e.target.value)}><option value="all">Alle (SFO + MFO)</option><option value="SFO">Single Family Office</option><option value="MFO">Multi Family Office</option></select></div>
       <div className="fld"><label>AUM-Bereich (Mrd €): {minAum} – {maxAum}</label>
         <div className="row2"><input type="number" value={minAum} min="0" max="50" onChange={e=>setMinAum(+e.target.value)}/><input type="number" value={maxAum} min="0" max="50" onChange={e=>setMaxAum(+e.target.value)}/></div></div>
       <div className="fld"><label>Immobilienquote min: {minReQ}%</label>
         <input type="range" min="0" max="100" value={minReQ} style={{width:"100%"}} onChange={e=>setMinReQ(+e.target.value)}/></div>
       <div className="fld"><label>Immobilien-Nutzung (auch für Pin-Suche)</label>
         <div className="chkgrid">{USAGE_KEYS.map(k=><div key={k} className="chk" onClick={()=>toggleUsage(k)}>
           <span className="sw" style={{background:activeUsages.has(k)?UC[k]:"#c9ced8"}}/>{UL[k]}</div>)}</div></div>
       <div className="togg" onClick={()=>setOnlyObjects(v=>!v)}><div className={"switch"+(onlyObjects?" on":"")}><i/></div> Nur mit bestätigten Objekten</div>
       <div className="togg" onClick={()=>setShowSold(v=>!v)}><div className={"switch"+(showSold?" on":"")}><i/></div> Verkaufte Objekte anzeigen</div>
       <div className="fld" style={{marginTop:10}}><label>📍 Radius-Suche (nutzt alle Filter oben)</label>
         <div className="row2"><input type="text" placeholder="Adresse eingeben…" value={addr} style={{flex:1}}
             onChange={e=>setAddr(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")geocodeAddr();}}/>
           <button className="btn sec" style={{whiteSpace:"nowrap"}} onClick={geocodeAddr} disabled={geoBusy}>{geoBusy?"…":"Suchen"}</button></div>
         {geoErr&&<div className="pininfo" style={{color:"var(--red)"}}>{geoErr}</div>}
         <div className="btnrow"><button className={"btn "+(pinMode?"":"sec")} onClick={()=>setPinMode(m=>!m)}>{pinMode?"Klicke auf Karte…":"oder Pin per Klick"}</button>
           {pin&&<button className="btn ghost" onClick={()=>{setPin(null);setAddr("");setGeoErr("");}}>Reset</button>}</div>
         {pin&&<div className="fld" style={{marginTop:8}}><label>Radius: {pinRadius} km</label><input type="range" min="1" max="200" value={pinRadius} style={{width:"100%"}} onChange={e=>setPinRadius(+e.target.value)}/></div>}
         <div className="pininfo">Bestätigtes Objekt im Radius (durchgezogen) + Heatmap-Überschneidung (gestrichelt, geschätzt).</div></div>
       <div className="btnrow"><button className="btn wide" onClick={()=>{setShowTable(true);setWinMode("normal");}}>Als Tabelle zeigen</button></div>
     </div>

     <div className="layerToggle glass">
       <button className={baseLayer==="sat"?"on":""} onClick={()=>setBaseLayer("sat")}>Satellit</button>
       <button className={baseLayer==="street"?"on":""} onClick={()=>setBaseLayer("street")}>Karte</button>
       <button className={showNewsPins?"on":""} onClick={()=>setShowNewsPins(v=>!v)} title="News-Deals als Pins (grün=besitzt, rot=besessen)">📰 News</button>
     </div>

     {/* BOTTOM-LEFT: selected firms + expandable picker of the rest */}
     <div className="seldock glass">
       <div className="seldock-h"><b>Auswahl · {selected.size}</b>
         {selected.size>0 && <button className="mini" onClick={()=>setSelected(new Set())}>alle ✕</button>}</div>
       {selected.size>0 &&
         <div className="togg" style={{padding:"2px 0 8px"}} onClick={()=>setSoloSel(v=>!v)}>
           <div className={"switch"+(soloSel?" on":"")}><i/></div> Nur Auswahl zeigen</div>}
       {selected.size===0
         ? <div className="selempty">Noch keine Firma ausgewählt. Unten hinzufügen oder auf der Karte antippen.</div>
         : <div className="selchips">
             {DATA.filter(o=>selected.has(o.id)).sort((a,b)=>a.kurz.localeCompare(b.kurz)).map(o=>(
               <div key={o.id} className="selchip" style={{"--ring":CM[o.category].color}}>
                 <span className="nm">{o.kurz}</span><span className="x" title="abwählen" onClick={()=>toggleSelect(o.id)}>✕</span></div>))}
           </div>}
       <div className="selexp">
         <div className="selexp-h" onClick={()=>{setSelOpen(v=>{if(v)setSelQuery("");return !v;});}}>
           <span>Firma hinzufügen · {DATA.filter(o=>!selected.has(o.id)).length}</span><span>{selOpen?"▾":"▸"}</span></div>
         {selOpen && (()=>{
           const avail=DATA.filter(o=>!selected.has(o.id));
           const q=selQuery.trim();
           let rows;
           if(q){
             rows=avail.map(o=>({o,s:foScore(o,q)})).filter(r=>r.s>0)
               .sort((a,b)=>b.s-a.s || a.o.kurz.localeCompare(b.o.kurz)).map(r=>r.o);
           } else {
             rows=avail.slice().sort((a,b)=>a.kurz.localeCompare(b.kurz));
           }
           return (<React.Fragment>
             <div className="selsearch">
               <span className="ss-ico">🔎</span>
               <input className="ss-in" type="text" value={selQuery} autoFocus
                 placeholder="Firma / Familie suchen (ungefähr reicht)…"
                 onChange={e=>setSelQuery(e.target.value)}
                 onKeyDown={e=>{
                   if(e.key==="Enter"&&rows.length){toggleSelect(rows[0].id);setSelQuery("");}
                   else if(e.key==="Escape"){setSelQuery("");}
                 }}/>
               {selQuery&&<span className="ss-x" title="Leeren" onClick={()=>setSelQuery("")}>✕</span>}
             </div>
             {rows.length===0
               ? <div className="selempty" style={{padding:"8px 4px"}}>Keine Firma gefunden für „{q}".</div>
               : <div className="selexp-list">
                   {rows.map(o=>(
                     <div key={o.id} className="selrow" onClick={()=>{toggleSelect(o.id);}}>
                       <span className="sc-dot" style={{background:CM[o.category].color}}/>
                       <span className="sr-nm">{o.kurz}</span>
                       {q&&o.kurz&&foNorm(o.name)!==foNorm(o.kurz)&&<span className="sr-sub">{o.name}</span>}
                     </div>))}
                 </div>}
           </React.Fragment>);
         })()}
       </div>
     </div>

     <div className="disc glass" style={{padding:"8px 10px"}}>Objekte = nur öffentlich bekannte DE-Objekte (nicht vollständig). Werte teils Schätzungen.</div>

     {showTable && (
       <div className="winwrap" onMouseDown={e=>{if(e.target.classList.contains("winwrap"))setShowTable(false);}}>
         <div className={"win glass "+(winMode==="min"?"min":winMode==="max"?"max":"")}>
           <div className="titlebar">
             <Lights onClose={()=>setShowTable(false)} onMin={()=>setWinMode(m=>m==="min"?"normal":"min")} onMax={()=>setWinMode(m=>m==="max"?"normal":"max")}/>
             <span className="t">{tableTab==="firms"?`Family Offices — ${tableRows.length} Einträge`:`Objekte — ${objectRows.length} Einträge`}{selected.size?` · ${selected.size} ausgewählt`:""}</span>
             <span className="sp"/>
             <div className="tabs">
               <button className={"tabbtn"+(tableTab==="firms"?" on":"")} onClick={()=>setTableTab("firms")}>Firmen ({tableRows.length})</button>
               <button className={"tabbtn"+(tableTab==="objects"?" on":"")} onClick={()=>setTableTab("objects")}>Objekte ({objectRows.length})</button>
             </div>
             <button className="btn sec" onClick={exportXlsx}>Export .xlsx</button>
           </div>
           {winMode!=="min" && tableTab==="firms" && <div className="tblscroll"><table>
             <thead><tr><th></th>{cols.map(([k,l])=><th key={k} className={["aumV","reV","reP","objs"].includes(k)?"num":""} onClick={()=>sortBy(k)}>{l}{sortMark(sortKey===k,sortDir)}</th>)}</tr></thead>
             <tbody>{tableRows.map(r=>(<tr key={r.id}>
               <td><input type="checkbox" checked={selected.has(r.id)} onChange={()=>toggleSelect(r.id)}/></td>
               <td>{r.Voll}</td><td>{r.Name}</td><td className="warum">{r.Warum}</td><td>{r.HQ}</td><td>{r.Typ}</td><td>{r.Land}</td>
               <td className="num">{r.aumV}</td><td className="num">{r.reV}</td><td className="num">{Math.round(r.reP*100)}%</td>
               <td className="num">{r.objs}</td><td>{r.Website}</td><td>{r.Kontakt}</td></tr>))}</tbody>
           </table></div>}
           {winMode!=="min" && tableTab==="objects" && <React.Fragment>
             <div className="objbar">
               <span>Umfang:</span>
               <div className="seg">
                 <button className={objScope==="all"?"on":""} onClick={()=>setObjScope("all")}>Alle im Bestand</button>
                 <button className={objScope==="radius"?"on":""} onClick={()=>pin&&setObjScope("radius")} disabled={!pin}
                   title={pin?"":"Erst einen Radius-Pin setzen"}>{pin?`Nur im Radius (${pinRadius} km)`:"Nur im Radius"}</button>
               </div>
               <span style={{marginLeft:"auto"}}>{objectRows.length} Objekte{objScope==="radius"&&pin?" im Radius":""}</span>
             </div>
             <div className="tblscroll"><table>
             <thead><tr>{objCols.map(([k,l])=><th key={k} className={k==="Wert"?"num":""} onClick={()=>sortObj(k)}>{l}{sortMark(objSortKey===k,objSortDir)}</th>)}</tr></thead>
             <tbody>{objectRows.length===0
               ? <tr><td colSpan={9} style={{color:"#5b6577",padding:"14px"}}>{objScope==="radius"&&pin?"Keine belegten Objekte in diesem Radius.":"Keine öffentlich belegten Objekte in der aktuellen Auswahl."}</td></tr>
               : objectRows.map(r=>(<tr key={r.key} className="objrow" onClick={()=>setDetail({kind:"object",office:r.office,data:r.ob})}>
                   <td>{r.Voll}</td><td><b>{r.Objekt}</b>{r.Sold&&<span className="sold-badge">verkauft</span>}</td><td>{r.Nutzung}</td>
                   <td>{r.Adresse}</td><td>{r.Flaeche}</td><td>{r.Kauf}</td>
                   <td className="num">{r.Wert??""}</td><td>{r.Status}</td><td>{r.Sold?"ja":"nein"}</td></tr>))}</tbody>
           </table></div>
           </React.Fragment>}
         </div>
       </div>
     )}

     {showNews && (
       <div className="winwrap" onMouseDown={e=>{if(e.target.classList.contains("winwrap"))setShowNews(false);}}>
         <div className={"newswin glass "+(newsMode==="min"?"min":newsMode==="max"?"max":"")}>
           <div className="titlebar">
             <Lights onClose={()=>setShowNews(false)} onMin={()=>setNewsMode(m=>m==="min"?"normal":"min")} onMax={()=>setNewsMode(m=>m==="max"?"normal":"max")}/>
             <span className="t">Markt-Radar — {newsResults.length} News · wer kauft &amp; verkauft was, wo</span>
             <span className="sp"/>
             <button className="btn sec" onClick={()=>{setShowNewsPins(true);setShowNews(false);}} title="Die aktuellen Treffer als Pins auf der Karte">Auf Karte zeigen</button>
           </div>
           {newsMode!=="min" && <React.Fragment>
             <div className="askbar">
               <div className="askrow">
                 <input className="askin" type="text" value={newsQuery} autoFocus
                   placeholder="Frag den Markt … z.B. „Wer kauft gerade in Berlin Büros?“"
                   onChange={e=>setNewsQuery(e.target.value)}
                   onKeyDown={e=>{if(e.key==="Enter")runNewsAsk();else if(e.key==="Escape"){setNewsQuery("");setNewsAsk("");}}}/>
                 <button className="askbtn" onClick={()=>runNewsAsk()}>Antwort holen</button>
               </div>
               <div className="askhints">
                 {["Wer kauft gerade in Berlin Büros?","Wohnungen München letzte 12 Monate","Wer verkauft Logistik?","Retail Frankfurt","Wer kauft Hotels?"].map(h=>
                   <span key={h} className="askhint" onClick={()=>runNewsAsk(h)}>{h}</span>)}
                 {(newsQuery||newsAsk)&&<span className="askhint" style={{color:"var(--red)"}} onClick={()=>{setNewsQuery("");setNewsAsk("");}}>✕ zurücksetzen</span>}
               </div>
             </div>
             {newsAnswer && <div className="aians">
               <div className="aih">🤖 KI-Antwort {newsResults.length>0&&<span style={{fontWeight:600,color:"#9a7a00"}}>· {newsResults.length} passende Meldungen</span>}</div>
               <div className="aitxt">{newsAnswer.plain}</div>
             </div>}
             <div className="newsfilt">
               <div className="grp"><span>Rolle:</span>
                 <div className="seg">
                   <button className={newsRolle==="all"?"on":""} onClick={()=>setNewsRolle("all")}>Alle</button>
                   <button className={newsRolle==="Käufer"?"on":""} onClick={()=>setNewsRolle("Käufer")}>Käufer</button>
                   <button className={newsRolle==="Verkäufer"?"on":""} onClick={()=>setNewsRolle("Verkäufer")}>Verkäufer</button>
                 </div>
               </div>
               <div className="grp"><span>Status:</span>
                 <div className="seg">
                   <button className={newsStatus==="all"?"on":""} onClick={()=>setNewsStatus("all")}>Alle</button>
                   <button className={newsStatus==="besitzt"?"on":""} style={newsStatus==="besitzt"?{background:NEWS_COL.besitzt}:{}} onClick={()=>setNewsStatus("besitzt")}>besitzt</button>
                   <button className={newsStatus==="besessen"?"on":""} style={newsStatus==="besessen"?{background:NEWS_COL.besessen}:{}} onClick={()=>setNewsStatus("besessen")}>besessen</button>
                 </div>
               </div>
               <div className="grp"><span>Objektart:</span>
                 <select value={newsUsage} onChange={e=>setNewsUsage(e.target.value)}>
                   <option value="all">Alle Arten</option>
                   {USAGE_KEYS.map(k=><option key={k} value={k}>{UL[k]}</option>)}
                 </select>
               </div>
               <div className="grp"><span>Zeitraum:</span>
                 <select value={newsMonths} onChange={e=>setNewsMonths(+e.target.value)}>
                   <option value={0}>Alle</option><option value={6}>6 Monate</option>
                   <option value={12}>12 Monate</option><option value={24}>24 Monate</option>
                 </select>
               </div>
               {pin && <div className="togg" style={{padding:0}} onClick={()=>setNewsPinOnly(v=>!v)}>
                 <div className={"switch"+(newsPinOnly?" on":"")}><i/></div> nur im Radius ({pinRadius} km)</div>}
             </div>
             <div className="newslist">
               {newsResults.length===0
                 ? <div className="newsempty">Keine passenden News.<br/>Tipp: allgemeiner suchen – nur Stadt oder nur Objektart – oder Filter zurücksetzen.</div>
                 : newsResults.map(n=>(
                     <div key={n.id} className="newscard" style={{"--nc":NEWS_COL[n.status]}} onClick={()=>setNewsDetail(n)}>
                       <div className="nleft">
                         <div className="nbadge">{USAGE_EMOJI[n.objektart]||"📰"}</div>
                         <div className="nstat">{NEWS_STATUS_LABEL[n.status]}</div>
                       </div>
                       <div className="nbody">
                         <div className="nhead">{n.headline}</div>
                         <div className="nmeta"><b>{n.firma}</b> · {n.rolle} · {n.stadt} · {monthName(n.datum)}</div>
                         <div className="nsum">{n.summary}</div>
                         <div className="nfoot">
                           <span className="npill">{UL[n.objektart]}</span>
                           {n.wertMioEUR&&<span className="nval">{fmtMio(n.wertMioEUR)}</span>}
                           <span style={{marginLeft:"auto"}}>Quelle: {n.quelle.label}</span>
                         </div>
                       </div>
                     </div>))}
             </div>
             <div className="newsfoot">
               <span>📰 {NEWS.length} News im Datensatz · Stand {NEWS_STAND}</span>
               <span style={{marginLeft:"auto"}}>grün = besitzt (gekauft, nicht wieder verkauft) · rot = besessen (verkauft)</span>
             </div>
           </React.Fragment>}
         </div>
       </div>
     )}

     {newsDetail && <NewsDetail n={newsDetail} onClose={()=>setNewsDetail(null)} onFirm={id=>{setNewsDetail(null);setShowNews(false);toggleSelect(id);}}/>}

     {detail && <Seite3 detail={detail} onClose={()=>setDetail(null)}/>}
   </React.Fragment>
  );
}

function FirmDetail({o,onObj,onReg,reason}){
  const about=o.about||autoAbout(o), st=foStructure(o);
  return (<div>
    <div className="brandhead">{o.domain&&<img src={ico(o.domain)} onError={e=>e.target.style.display='none'}/>}<div><div className="meta" style={{marginBottom:0}}>{o.name}</div><div className="uidline">Argo UID: <b>{o.uid?o.uid:"—"}</b></div></div></div>
    {reason&&<div className="why"><b>Warum in deiner Suche:</b> {reason}</div>}
    <div className="ankbox">
      <div className="ai-h">Ankaufsprofil</div>
      {o.ankaufsprofil && o.ankaufsprofil!=="nicht öffentlich ermittelbar"
        ? <div className="body">{o.ankaufsprofil}</div>
        : <div className="body na">{o.ankaufsprofil||"nicht öffentlich ermittelbar"}</div>}
    </div>
    <div className="aibox">
      <div className="ai-h">Kurzprofil {!o.about&&<span className="ai-tag">auto</span>}{o.about&&<span className="ai-tag">KI-recherchiert</span>}</div>
      <ul>{about.map((b,i)=><li key={i}>{b}</li>)}</ul>
    </div>
    <div className="aibox">
      <div className="ai-h">Struktur &amp; Ansprache {st.curated&&<span className="ai-tag">KI-recherchiert</span>}</div>
      {st.fo&&<div className="row"><b>Family Office:</b> {st.fo}</div>}
      {st.managers&&st.managers.length>0&&<div className="row"><b>{st.managers.length>1?"Verantwortliche":"Verantwortlich"}:</b> {st.managers.join(" · ")}</div>}
      {st.decisions&&<div className="row"><b>Ankäufe:</b> {st.decisions}</div>}
      {st.contact&&<div className="row"><b>Bei wem melden:</b> {st.contact}</div>}
      {!st.curated&&<div className="row" style={{color:"var(--muted)",fontStyle:"italic"}}>Aus Kontaktdaten abgeleitet – noch nicht kuratiert.</div>}
    </div>
    <div className="kv"><span>Typ</span><span>{o.typ} · {o.land}</span></div>
    <div className="kv"><span>Headquarter</span><span>{o.hqAddress}</span></div>
    <div className="kv"><span>Website</span><span><a className="lnk" href={/^https?:/.test(o.website)?o.website:"https://"+o.domain} target="_blank">{o.website}</a></span></div>
    {o.linkedin&&<div className="kv"><span>LinkedIn (Firma)</span><span><a className="lnk" href={o.linkedin} target="_blank">Unternehmen</a></span></div>}
    {o.contactLinkedin&&<div className="kv"><span>LinkedIn (Kontakt)</span><span><a className="lnk" href={o.contactLinkedin} target="_blank">{o.contactLinkedinName||"Ansprechpartner"}</a></span></div>}
    <div className="kv"><span>Kontakt</span><span>{o.contactName}</span></div>
    <div className="kv"><span>Ansprache</span><span>{o.contactChannel}</span></div>
    <div className="srcbox">
      <div className="kv" style={{borderTop:"none",paddingTop:0}}><span>AUM {o.aum.basis==="extrapolation"&&<span className="est-badge">geschätzt</span>}</span><b>{fmtB(o.aum.value)}</b></div>
      <Sources field={o.aum} label="Beleg"/></div>
    <div className="srcbox">
      <div className="kv" style={{borderTop:"none",paddingTop:0}}><span>Immobilienquote {o.reQuote.basis==="extrapolation"&&<span className="est-badge">geschätzt</span>}</span><b>{Math.round(o.reQuote.value*100)}% · {fmtB(o.reInvestedEUR)}</b></div>
      <Sources field={o.reQuote} label="Beleg"/></div>
    <div className="objlist">
      <div style={{fontSize:12,color:"#5b6577",margin:"10px 0 4px",textTransform:"uppercase",letterSpacing:.5}}>Bestätigte Objekte ({o.confirmedObjects.length})</div>
      {o.confirmedObjects.length===0&&<div className="obj a" style={{cursor:"default"}}>Keine Einzelobjekte öffentlich belegt.</div>}
      {o.confirmedObjects.map((ob,i)=><div className="obj" key={i} onClick={()=>onObj(o,ob)}><b>{ob.name}</b> · {UL[ob.usage]}{isSold(ob)&&<span className="sold-badge">verkauft</span>} ›<br/><span className="a">{ob.address}</span></div>)}
      <div style={{fontSize:12,color:"#5b6577",margin:"12px 0 4px",textTransform:"uppercase",letterSpacing:.5}}>Heatmap-Regionen ({(o.heatmap||[]).length})</div>
      {(o.heatmap||[]).map((r,i)=><div className="obj" key={i} onClick={()=>onReg(o,r)}><b>{r.name}</b> · {r.intensity} {r.basis==="extrapolation"&&<span className="est-badge">geschätzt</span>} ›<br/><span className="a">{r.usages?r.usages.map(u=>UL[u]).join(", "):"Nutzungsart nicht spezifiziert"}</span></div>)}
    </div>
  </div>);
}

function Seite3({detail,onClose}){
  const {kind,office,data}=detail,isObj=kind==="object";
  const col=isObj?(isSold(data)?"#E4002B":(UC[data.usage]||"#888")):"#ffb02e";
  return (<div className="s3wrap" onMouseDown={e=>{if(e.target.classList.contains("s3wrap"))onClose();}}>
    <div className="s3 glass">
      <div className="hd">
        <div className="lights"><span className="light l-red" onClick={onClose}/><span className="light l-yellow dis"/><span className="light l-green dis"/></div>
        {office.domain&&<img src={ico(office.domain)} onError={e=>e.target.style.display='none'} style={{width:22,height:22,borderRadius:5,objectFit:"contain"}}/>}
        <span style={{fontSize:12,fontWeight:700,color:"#0A1F44"}}>{office.kurz}</span>
      </div>
      <div className="bd">
        <span className="tag" style={{background:col}}>{isObj?(isSold(data)?"Verkauftes Objekt":"Bestätigtes Objekt"):"Heatmap-Region (geschätzt)"}</span>
        <h3 style={{marginTop:8}}>{data.name}</h3>
        {isObj ? (<div>
          <div className="aibox">
            <div className="ai-h">Verbindung zu {office.kurz} {data.connection&&<span className="ai-tag">KI-recherchiert</span>}</div>
            <div className="row">{data.connection || `Dieses Gebäude wird ${office.kurz} zugerechnet. ${data.purchaseDate?`Ein Hinweis darauf steht schon im Feld Kaufdatum: „${data.purchaseDate}". `:""}Wie genau die Familie dahintersteht, kannst du in den Quellen ganz unten nachlesen.`}</div>
          </div>
          <div className="kv"><span>Adresse</span><span>{data.address}</span></div>
          <div className="kv"><span>Nutzungsart</span><span>{UL[data.usage]}</span></div>
          <div className="kv"><span>Fläche</span><span>{data.area||"—"}</span></div>
          <div className="kv"><span>Kaufdatum</span><span>{data.purchaseDate||"—"}</span></div>
          <div className="kv"><span>Wert (Schätzung)</span><span>~{data.valueEUR} Mio €</span></div>
          <div className="kv"><span>Status</span><span>{data.status}{isSold(data)&&<span className="sold-badge">verkauft</span>}</span></div>
          {data.images&&data.images.length>0? <div style={{marginTop:8}}>{data.images.map((u,i)=><img key={i} src={u} style={{width:"100%",borderRadius:10,marginBottom:6}}/>)}</div> : <div className="src" style={{marginTop:8}}>Keine Bilder verfügbar.</div>}
          <div className="srcbox"><Sources field={{basis:"quelle",sources:data.sources}} label="Quelle" notes={office._srcNotes}/></div>
        </div>) : (<div>
          <div className="kv"><span>Region</span><span>{data.name}</span></div>
          <div className="kv"><span>Investitionsintensität</span><span style={{textTransform:"capitalize"}}>{data.intensity}</span></div>
          <div className="kv"><span>Nutzungsart</span><span>{data.usages?data.usages.map(u=>UL[u]).join(", "):"nicht spezifiziert"}</span></div>
          <div className="src" style={{marginTop:8}}>Keine exakte Adresse / kein Kaufdatum / kein exakter Wert – da nicht vorhanden.</div>
          <div className="srcbox"><Sources field={data} label="Beleg"/></div>
        </div>)}
      </div>
    </div>
  </div>);
}

function NewsDetail({n,onClose,onFirm}){
  const col=NEWS_COL[n.status]||"#34c759";
  const inDb=n.firmaId && DATA.some(o=>o.id===n.firmaId);
  return (<div className="s3wrap" onMouseDown={e=>{if(e.target.classList.contains("s3wrap"))onClose();}}>
    <div className="s3 glass">
      <div className="hd">
        <div className="lights"><span className="light l-red" onClick={onClose}/><span className="light l-yellow dis"/><span className="light l-green dis"/></div>
        <span style={{fontSize:20}}>{USAGE_EMOJI[n.objektart]||"📰"}</span>
        <span style={{fontSize:12,fontWeight:700,color:"#0A1F44"}}>{n.firma}</span>
      </div>
      <div className="bd">
        <span className="tag" style={{background:col}}>{n.rolle} · {n.status==="besitzt"?"besitzt jetzt":"besaß (verkauft)"}</span>
        <h3 style={{marginTop:8}}>{n.headline}</h3>
        <div className="aibox">
          <div className="ai-h">Zusammenfassung</div>
          <div className="row">{n.summary}</div>
        </div>
        <div className="kv"><span>Firma</span><span>{n.firma}</span></div>
        <div className="kv"><span>Objekt</span><span>{n.objekt}</span></div>
        <div className="kv"><span>Objektart</span><span>{UL[n.objektart]||n.objektart}</span></div>
        <div className="kv"><span>Stadt / Region</span><span>{n.stadt} · {n.region}</span></div>
        <div className="kv"><span>Volumen</span><span>{n.wertMioEUR?fmtMio(n.wertMioEUR):"—"}</span></div>
        <div className="kv"><span>Datum</span><span>{monthName(n.datum)}</span></div>
        <div className="kv"><span>Status</span><span>{n.status==="besitzt"?"gekauft, nicht wieder verkauft":"verkauft bzw. wieder verkauft"}</span></div>
        {inDb && <div className="btnrow" style={{marginTop:10}}><button className="btn wide" onClick={()=>onFirm(n.firmaId)}>Family Office in der Karte anzeigen</button></div>}
        <div className="srcbox"><div className="src"><span className="lab">Quelle:</span> <a href={n.quelle.url} target="_blank" rel="noopener">{n.quelle.label}</a></div></div>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
