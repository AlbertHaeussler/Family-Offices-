# ---------------------------------------------------------------------------
# Report / table registry — the "which tables to extract" list.
#
# Each entry is one extractable table. Adding a new table is (ideally) just
# adding a block here + capturing it once with `rca-scrape capture --report X`.
#
# Fields:
#   endpoint_path : API path (relative to site.base_url).
#   capture_file  : filename under captures/ holding the real request payload
#                   (created by `rca-scrape capture`). Keeps the exact query the
#                   site sends — do not hand-edit unless you know the schema.
#   page_size_key : JSON key in the payload that controls rows per request.
#   page_size     : value to request per page (raised well above the UI's 500).
#   total_key     : dotted path in the response to the grand-total count.
#   rows_key      : dotted path in the response to the array of row objects.
#   id_key        : field on each row used to de-duplicate across pages/tiles.
#   overrides     : payload keys to force (e.g. mode flags) when replaying.
#   tiling        : if true, subdivide MapBounds to get past the server's cap.
#   saturation    : if a tile returns >= this many rows, it's assumed truncated
#                   and gets split into 4 (observed server cap ~2596).
#
# rows_key / total_key / id_key below were CONFIRMED against a live probe
# response (see README "How it works").
# ---------------------------------------------------------------------------

# Germany bounding box [west, south, east, north] — the tiler starts here for
# the property-based reports so it doesn't sweep the empty rest of the globe.
# (The captured request's own geography filter still applies on top.)
_germany: &germany [5.8, 47.2, 15.1, 55.1]

reports:
  # --- Property-based tables: share the propertySearch endpoint; the mode is
  #     selected by the override flags, so ONE captured request serves all three.
  transactions:
    endpoint_path: "/api/v1/propertySearch/search"
    capture_file: "transactions.json"
    page_size_key: "Size"
    page_size: 10000                         # server accepts up to ~10k per request
    rows_key: "data.pinTransactionItems"     # confirmed: 97-col detailed rows
    total_key: "data.resultCount"             # confirmed: matches-count for the search
    id_key: "PropertyId"                       # unique per normal row (+DealId composite)
    # Geography (Germany) filter dominates -> MapBounds is ignored -> partition
    # by transaction date instead. DateRangeType is auto-detected at run start.
    partition: "date"
    date_path: "TransactionSearchFilters.DateRange"
    date_type: 0
    date_format: "%m/%d/%Y"
    date_start: "1970-01-01"
    saturation: 6000                          # window with >=6k rows is truncated -> split
    overrides:
      isTransactionsRequest: true
      isHoldingsRequest: false

  # Holdings mode = current ownership. Toggle confirmed via diagnose-modes:
  # PropertiesRequestType=0 fills data.pinHoldingItems (~48.7k German holdings).
  holdings:
    endpoint_path: "/api/v1/propertySearch/search"
    capture_file: "transactions.json"        # reuse the same captured base request
    page_size_key: "Size"
    page_size: 10000
    rows_key: "data.pinHoldingItems"
    total_key: "data.resultCount"
    id_key: "PropertyId"
    # Try date partitioning first; it self-diagnoses and aborts fast if the
    # DateRange filter doesn't narrow holdings (then we switch axis).
    partition: "date"
    date_path: "TransactionSearchFilters.DateRange"
    date_type: 0
    date_format: "%m/%d/%Y"
    date_start: "1970-01-01"
    saturation: 6000
    overrides:
      PropertiesRequestType: 0

  registered_properties:
    endpoint_path: "/api/v1/propertySearch/search"
    capture_file: "transactions.json"        # same endpoint; toggled by override
    page_size_key: "Size"
    page_size: 3000
    rows_key: "data.pinTransactionItems"    # TODO confirm from discovered.json
    total_key: "data.resultCount"
    id_key: "PropertyId"
    overrides:
      RegisteredPropertiesFilter: {isRegisteredPropertiesVisible: true}
    tiling: true
    saturation: 2000
    bounds: *germany

  # --- Non-property tables: separate endpoints + shapes, filled in from the
  #     capture manifest (discovered.json) after the one-login capture session.
  #     Placeholders below are marked TODO and confirmed against real responses.
  # Investor profiles are fetched headless via `rca-scrape investors` (the
  # companyprofile/{GUID} API), using GUIDs pulled from the transactions data —
  # not via a search endpoint. This entry just names the store + id column.
  investors:
    endpoint_path: "/api/v1/companyprofile"
    capture_file: "transactions.json"
    rows_key: "n/a"
    total_key: "n/a"
    id_key: "CompanyId"
    partition: "none"                            # likely a flat list, not map-tiled

  funds:
    endpoint_path: "TODO"                    # from discovered.json (Funds tab)
    capture_file: "funds.json"
    page_size_key: "Size"
    page_size: 5000
    rows_key: "TODO"
    total_key: "TODO"
    id_key: "TODO"
    tiling: false

  trends:
    endpoint_path: "TODO"                    # from discovered.json (Trends tab)
    capture_file: "trends.json"
    rows_key: "TODO"                          # NOTE: trends may be aggregates, not rows
    total_key: "TODO"
    id_key: "TODO"
    tiling: false

  # Further tables (investors/players, funds, trends, registered properties, …)
  # get added here as we capture each one. Left as a stub for now:
  # investors:
  #   endpoint_path: "/api/v1/..."      # capture to discover
  #   capture_file: "investors.json"
  #   ...
